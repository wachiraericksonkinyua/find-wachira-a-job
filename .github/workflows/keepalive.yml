name: Keep Alive

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled jobs, so use an external
    # uptime monitor as well if Render's free instance must never sleep.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping backend health endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Check for BACKEND_HEALTH_URL
        id: config
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "::notice::BACKEND_HEALTH_URL is not set; skipping keep-alive ping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Point BACKEND_HEALTH_URL at /api/keepalive. Unlike /health, that route
      # runs `SELECT 1` against Postgres when configured, keeping both Render
      # and a free Supabase project warm.
      - name: Curl keepalive endpoint
        if: steps.config.outputs.configured == 'true'
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 "$BACKEND_HEALTH_URL" | tail -c 500
